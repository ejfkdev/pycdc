[package]
name = "pycdc"
version = "0.3.0"
edition = "2021"
authors = ["ejfkdev <152914458+ejfkdev@users.noreply.github.com>"]
description = "Python bytecode (pyc) disassembler and decompiler for Python 1.x - 3.x, written in Rust"
readme = "README.md"
license = "GPL-3.0-or-later"
keywords = ["python", "bytecode", "decompiler", "disassembler", "pyc"]
categories = ["command-line-utilities", "development-tools::debugging"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
serde_json = "1"

[[bin]]
name = "pycdc"
path = "src/main.rs"

[[bin]]
name = "pycdas"
path = "src/bin/pycdas.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
