[package]
name = "pycdc"
version = "0.1.0"
edition = "2021"
description = "Python bytecode (pyc) disassembler and decompiler for Python 1.x - 3.x, written in Rust"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
serde_json = "1"

[[bin]]
name = "pycdc"
path = "src/main.rs"

[[bin]]
name = "pycdas"
path = "src/bin/pycdas.rs"

[profile.release]
opt-level = 2
