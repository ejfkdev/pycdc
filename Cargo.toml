[package]
name = "pycdc"
version = "0.5.0"
edition = "2021"
rust-version = "1.70"
authors = ["ejfkdev <152914458+ejfkdev@users.noreply.github.com>"]
description = "Python bytecode (pyc) disassembler and decompiler for Python 2.0 - 3.15, written in Rust"
readme = "README.md"
license = "MIT"
repository = "https://github.com/ejfkdev/pycdc"
homepage = "https://github.com/ejfkdev/pycdc"
keywords = ["python", "bytecode", "decompiler", "disassembler", "pyc"]
categories = ["command-line-utilities", "development-tools::debugging"]
# keep the published .crate lean: the 520-module verification corpus,
# behavior matrix, python tooling and docs stay in the git repo only
exclude = [
    "/tests/corpus",
    "/tests/behavior",
    "/tests/data",
    "/tests/fixtures",
    "/tools",
    "/docs",
    "/.github",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
serde_json = "1"

[[bin]]
name = "pycdc"
path = "src/main.rs"

[[bin]]
name = "pycdas"
path = "src/bin/pycdas.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
