name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release
      - name: Smoke (decompile + disassemble committed fixtures)
        shell: bash
        run: |
          bin=target/release/pycdc
          das=target/release/pycdas
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            bin=target/release/pycdc.exe
            das=target/release/pycdas.exe
          fi
          "$bin" version
          "$bin" tests/corpus/3.12.14/base64.pyc | head -3
          "$das" tests/corpus/3.12.14/base64.pyc | head -3
          cat tests/corpus/3.12.14/base64.pyc | "$bin" - | head -3

  clippy:
    # informational: the codebase carries a style-warning long tail
    # (see docs/LIMITATIONS.md); this job never blocks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --release -- -D clippy::correctness
